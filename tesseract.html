<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rezept → Bring</title>
    <script async src="//platform.getbring.com/widgets/import.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .camera-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .camera-button:disabled,
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .preview-section {
            display: none;
            margin-top: 30px;
        }

        .preview-section.active {
            display: block;
        }

        .video-container {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 10px;
            background: #000;
            margin-bottom: 15px;
        }

        video {
            width: 100%;
            height: auto;
            display: block;
        }

        canvas {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 15px;
            background: #000;
            display: none;
        }

        .ingredients-list {
            text-align: left;
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            max-height: 300px;
            overflow-y: auto;
        }

        .ingredients-list h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .ingredient-item {
            background: white;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 5px;
            border-left: 4px solid #667eea;
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 14px;
        }

        .ingredient-item input {
            flex: 1;
            min-width: 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 8px;
            color: #333;
            font-size: 14px;
        }

        .ingredient-item button {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 7px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 50px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-light {
            background: #333;
            color: white;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }

        .error.active {
            display: block;
        }

        .info-box {
            background: #f0f7ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #555;
        }

        .status {
            min-height: 22px;
            margin: 10px 0;
            color: #555;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📸 Rezept → Bring</h1>

        <p class="subtitle">
            Fotografiere deine Zutaten und importiere sie direkt in Bring!
        </p>

        <div class="info-box">
            ℹ️ Fotografiere die Zutatenliste aus deinem Kochbuch. OCR liest die Zutaten aus.
        </div>

        <div class="error" id="errorMsg"></div>

        <button class="camera-button" id="cameraBtn">
            📷 Kamera starten
        </button>

        <div class="preview-section" id="previewSection">
            <div class="video-container">
                <video id="video" playsinline autoplay></video>
            </div>

            <canvas id="canvas"></canvas>

            <div class="button-group" id="cameraButtons">
                <button class="btn btn-secondary" id="retakeBtn">
                    Neues Foto
                </button>

                <button class="btn btn-primary" id="captureBtn">
                    📷 Foto machen
                </button>
            </div>

            <button
                class="camera-button btn-light"
                id="toggleTorchBtn"
                style="display: none;">
                💡 Licht an
            </button>

            <div class="status" id="status"></div>

            <div class="loading" id="loadingIndicator">
                <div class="spinner"></div>
                <p>Analysiere Zutaten...</p>
            </div>

            <div class="ingredients-list" id="ingredientsList" style="display: none;">
                <h3>📋 Erkannte Zutaten:</h3>

                <div id="ingredientsContainer"></div>

                <div class="button-group">
                    <button class="btn btn-secondary" id="newPhotoBtn">
                        Neues Foto
                    </button>

                    <button class="btn btn-primary" id="sendBringBtn">
                        ✓ Zu Bring senden
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.1.1/dist/tesseract.min.js"></script>

    <script>
        const workerBaseUrl =
            'https://recipe-scan-bring.scanandcook.workers.dev/';

        const bringApiUrl =
            'https://api.getbring.com/rest/bringrecipes/deeplink';

        const elements = {
            cameraBtn: document.getElementById('cameraBtn'),
            video: document.getElementById('video'),
            canvas: document.getElementById('canvas'),
            captureBtn: document.getElementById('captureBtn'),
            retakeBtn: document.getElementById('retakeBtn'),
            newPhotoBtn: document.getElementById('newPhotoBtn'),
            cameraButtons: document.getElementById('cameraButtons'),
            toggleTorchBtn: document.getElementById('toggleTorchBtn'),
            previewSection: document.getElementById('previewSection'),
            loadingIndicator: document.getElementById('loadingIndicator'),
            ingredientsList: document.getElementById('ingredientsList'),
            ingredientsContainer: document.getElementById('ingredientsContainer'),
            sendBringBtn: document.getElementById('sendBringBtn'),
            errorMsg: document.getElementById('errorMsg'),
            status: document.getElementById('status')
        };

        let videoStream = null;
        let torchEnabled = false;
        let recognizedIngredients = [];

        elements.cameraBtn.addEventListener('click', startCamera);
        elements.retakeBtn.addEventListener('click', startCamera);
        elements.newPhotoBtn.addEventListener('click', startCamera);
        elements.captureBtn.addEventListener('click', capturePhoto);
        elements.toggleTorchBtn.addEventListener('click', toggleTorch);
        elements.sendBringBtn.addEventListener('click', sendToBring);

        async function startCamera() {
            try {
                hideError();
                hideIngredients();
                setStatus('');

                stopCamera();

                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment'
                    }
                });

                elements.video.srcObject = videoStream;
                elements.previewSection.classList.add('active');
                elements.cameraBtn.style.display = 'none';
                elements.video.style.display = 'block';
                elements.canvas.style.display = 'none';
                elements.cameraButtons.style.display = 'flex';

                torchEnabled = false;
                updateTorchButton();
            } catch (error) {
                showError(
                    'Kamera konnte nicht gestartet werden. Bitte Berechtigung prüfen.'
                );

                console.error('Kamera-Fehler:', error);
            }
        }

        function stopCamera() {
            if (!videoStream) {
                return;
            }

            videoStream.getTracks().forEach(track => track.stop());
            videoStream = null;
            torchEnabled = false;
        }

        function getVideoTrack() {
            if (!videoStream) {
                return null;
            }

            return videoStream.getVideoTracks()[0] || null;
        }

        function updateTorchButton() {
            const track = getVideoTrack();

            if (!track || !track.getCapabilities) {
                elements.toggleTorchBtn.style.display = 'none';
                return;
            }

            const capabilities = track.getCapabilities();

            if (!capabilities.torch) {
                elements.toggleTorchBtn.style.display = 'none';
                return;
            }

            elements.toggleTorchBtn.style.display = 'block';
            elements.toggleTorchBtn.textContent =
                torchEnabled ? '💡 Licht aus' : '💡 Licht an';
        }

        async function toggleTorch() {
            const track = getVideoTrack();

            if (!track || !track.getCapabilities) {
                showError(
                    'Die Kamerabeleuchtung wird von diesem Gerät nicht unterstützt.'
                );

                return;
            }

            const capabilities = track.getCapabilities();

            if (!capabilities.torch) {
                showError(
                    'Die Kamerabeleuchtung wird von diesem Gerät nicht unterstützt.'
                );

                return;
            }

            try {
                torchEnabled = !torchEnabled;

                await track.applyConstraints({
                    advanced: [
                        {
                            torch: torchEnabled
                        }
                    ]
                });

                updateTorchButton();
            } catch (error) {
                torchEnabled = false;
                updateTorchButton();

                showError(
                    'Die Kamerabeleuchtung konnte nicht geändert werden.'
                );

                console.error('Torch-Fehler:', error);
            }
        }

        function capturePhoto() {
            if (!elements.video.videoWidth || !elements.video.videoHeight) {
                showError('Die Kamera ist noch nicht bereit.');
                return;
            }

            const context = elements.canvas.getContext('2d');

            elements.canvas.width = elements.video.videoWidth;
            elements.canvas.height = elements.video.videoHeight;

            context.drawImage(
                elements.video,
                0,
                0,
                elements.canvas.width,
                elements.canvas.height
            );

            stopCamera();

            elements.video.style.display = 'none';
            elements.canvas.style.display = 'block';
            elements.cameraButtons.style.display = 'none';
            elements.toggleTorchBtn.style.display = 'none';
            elements.loadingIndicator.classList.add('active');
            setStatus('Tesseract.js liest den Text...');

            recognizeText();
        }

        async function recognizeText() {
            try {
                const imageData = elements.canvas.toDataURL('image/png');

                const result = await Tesseract.recognize(
                    imageData,
                    'deu',
                    {
                        logger: message => {
                            if (message.status === 'recognizing text') {
                                const progress = Math.round(
                                    (message.progress || 0) * 100
                                );

                                setStatus(
                                    `Tesseract.js liest den Text... ${progress}%`
                                );
                            }
                        }
                    }
                );

                parseIngredients(result.data.text);
            } catch (error) {
                showError('OCR-Fehler: Bitte versuche es erneut.');
                console.error('OCR-Fehler:', error);
                resetAfterError();
            }
        }

        function parseIngredients(text) {
            const lines = text
                .split('\n')
                .filter(line => line.trim().length > 0);

            recognizedIngredients = lines.map(line => ({
                original: line.trim(),
                edited: line.trim()
            }));

            elements.loadingIndicator.classList.remove('active');
            setStatus('Text wurde erkannt.');
            displayIngredients();
            elements.ingredientsList.style.display = 'block';
        }

        function displayIngredients() {
            elements.ingredientsContainer.innerHTML = '';

            recognizedIngredients.forEach((ingredient, index) => {
                const div = document.createElement('div');
                div.className = 'ingredient-item';

                const input = document.createElement('input');
                input.type = 'text';
                input.value = ingredient.edited;
                input.dataset.index = index;

                input.addEventListener('input', event => {
                    const currentIndex = parseInt(
                        event.target.dataset.index,
                        10
                    );

                    recognizedIngredients[currentIndex].edited =
                        event.target.value;
                });

                const deleteButton = document.createElement('button');
                deleteButton.type = 'button';
                deleteButton.textContent = 'Löschen';

                deleteButton.addEventListener('click', () => {
                    recognizedIngredients.splice(index, 1);
                    displayIngredients();
                });

                div.appendChild(input);
                div.appendChild(deleteButton);
                elements.ingredientsContainer.appendChild(div);
            });
        }

        async function sendToBring() {
            const ingredients = recognizedIngredients
                .map(ingredient => ingredient.edited.trim())
                .filter(ingredient => ingredient.length > 0);

            if (ingredients.length === 0) {
                showError('Es wurden keine Zutaten gefunden.');
                return;
            }

            const recipeData = {
                name: 'Gescanntes Rezept',
                ingredients
            };

            const recipeUrl = createWorkerRecipeUrl(recipeData);
            const bringUrl = createBringUrl(recipeUrl);

            elements.sendBringBtn.disabled = true;
            elements.loadingIndicator.classList.add('active');
            setStatus('Bring wird geöffnet...');

            window.location.href = bringUrl;
        }

        function createWorkerRecipeUrl(recipeData) {
            const encodedData = encodeURIComponent(
                JSON.stringify(recipeData)
            );

            return `${workerBaseUrl}?data=${encodedData}`;
        }

        function createBringUrl(recipeUrl) {
            const encodedRecipeUrl = encodeURIComponent(recipeUrl);

            return `${bringApiUrl}?url=${encodedRecipeUrl}&source=web`;
        }

        function hideIngredients() {
            elements.ingredientsList.style.display = 'none';
            elements.ingredientsContainer.innerHTML = '';
            recognizedIngredients = [];
        }

        function resetAfterError() {
            elements.loadingIndicator.classList.remove('active');
            elements.cameraButtons.style.display = 'flex';
            elements.video.style.display = 'block';
            elements.canvas.style.display = 'none';
            updateTorchButton();
        }

        function setStatus(message) {
            elements.status.textContent = message;
        }

        function showError(message) {
            elements.errorMsg.textContent = message;
            elements.errorMsg.classList.add('active');
        }

        function hideError() {
            elements.errorMsg.textContent = '';
            elements.errorMsg.classList.remove('active');
        }
    </script>
</body>
</html>
