<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rezept → Bring</title>
    <script async src="//platform.getbring.com/widgets/import.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .camera-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .camera-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .camera-button:active {
            transform: translateY(0);
        }

        .preview-section {
            display: none;
            margin-top: 30px;
        }

        .preview-section.active {
            display: block;
        }

        .video-container {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 10px;
            background: #000;
            margin-bottom: 15px;
        }

        video {
            width: 100%;
            height: auto;
            display: block;
            transform: scaleX(-1);
        }

        canvas {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 15px;
            background: #000;
            display: none;
            transform: scaleX(-1);
        }

        .ingredients-list {
            text-align: left;
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            max-height: 300px;
            overflow-y: auto;
        }

        .ingredients-list h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .ingredient-item {
            background: white;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 5px;
            border-left: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .ingredient-item input {
            flex: 1;
            border: none;
            background: transparent;
            color: #333;
            font-size: 14px;
            margin-left: 10px;
        }

        .ingredient-item button {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 50px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }

        .error.active {
            display: block;
        }

        .info-box {
            background: #f0f7ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #555;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📸 Rezept → Bring</h1>
        <p class="subtitle">
            Fotografiere deine Zutaten und importiere sie direkt in Bring!
        </p>

        <div class="info-box">
            ℹ️ Fotografiere die Zutatenliste aus deinem Kochbuch. OCR liest die Zutaten aus.
        </div>

        <div class="error" id="errorMsg"></div>

        <button class="camera-button" id="cameraBtn">
            📷 Kamera starten
        </button>

        <div class="preview-section" id="previewSection">
            <div class="video-container">
                <video id="video" playsinline autoplay></video>
            </div>

            <canvas id="canvas"></canvas>

            <div class="button-group">
                <button class="btn btn-secondary" id="retakeBtn">
                    Neues Foto
                </button>

                <button class="btn btn-primary" id="captureBtn">
                    📷 Foto machen
                </button>
            </div>

            <div class="loading" id="loadingIndicator">
                <div class="spinner"></div>
                <p>Analysiere Zutaten...</p>
            </div>

            <div class="ingredients-list" id="ingredientsList" style="display: none;">
                <h3>📋 Erkannte Zutaten:</h3>

                <div id="ingredientsContainer"></div>

                <div class="button-group" style="margin-top: 15px;">
                    <button class="btn btn-secondary" id="editBtn">
                        Bearbeiten
                    </button>

                    <button class="btn btn-primary" id="sendBringBtn">
                        ✓ Zu Bring senden
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.1.1/dist/tesseract.min.js"></script>

    <script>
        let videoStream = null;
        let recognizedIngredients = [];

        const elements = {
            cameraBtn: document.getElementById('cameraBtn'),
            video: document.getElementById('video'),
            canvas: document.getElementById('canvas'),
            captureBtn: document.getElementById('captureBtn'),
            retakeBtn: document.getElementById('retakeBtn'),
            previewSection: document.getElementById('previewSection'),
            loadingIndicator: document.getElementById('loadingIndicator'),
            ingredientsList: document.getElementById('ingredientsList'),
            ingredientsContainer: document.getElementById('ingredientsContainer'),
            sendBringBtn: document.getElementById('sendBringBtn'),
            errorMsg: document.getElementById('errorMsg')
        };

        elements.cameraBtn.addEventListener('click', async () => {
            try {
                hideError();

                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment'
                    }
                });

                elements.video.srcObject = videoStream;
                elements.previewSection.classList.add('active');
                elements.cameraBtn.style.display = 'none';
                elements.video.style.display = 'block';
                elements.canvas.style.display = 'none';
            } catch (error) {
                showError(
                    'Kamera konnte nicht zugegriffen werden. Bitte Berechtigung geben.'
                );

                console.error('Kamera-Fehler:', error);
            }
        });

        elements.captureBtn.addEventListener('click', () => {
            const context = elements.canvas.getContext('2d');

            elements.canvas.width = elements.video.videoWidth;
            elements.canvas.height = elements.video.videoHeight;

            // Das Bild wird unverändert auf das Canvas gezeichnet.
            // Die Korrektur der Anzeige erfolgt ausschließlich über CSS.
            context.drawImage(elements.video, 0, 0);

            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }

            elements.video.style.display = 'none';
            elements.canvas.style.display = 'block';
            document.querySelector('.button-group').style.display = 'none';
            elements.loadingIndicator.classList.add('active');

            recognizeText();
        });

        elements.retakeBtn.addEventListener('click', async () => {
            try {
                elements.video.style.display = 'block';
                elements.canvas.style.display = 'none';
                document.querySelector('.button-group').style.display = 'flex';
                elements.ingredientsList.style.display = 'none';
                recognizedIngredients = [];

                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment'
                    }
                });

                elements.video.srcObject = videoStream;
            } catch (error) {
                showError(
                    'Kamera konnte nicht zugegriffen werden. Bitte Berechtigung geben.'
                );

                console.error('Kamera-Fehler:', error);
            }
        });

        async function recognizeText() {
            try {
                const imageData = elements.canvas.toDataURL('image/png');

                const result = await Tesseract.recognize(
                    imageData,
                    'deu',
                    {
                        logger: message => console.log(message)
                    }
                );

                parseIngredients(result.data.text);
            } catch (error) {
                showError('OCR-Fehler: Bitte versuche es erneut.');
                console.error('OCR-Fehler:', error);
                resetAfterError();
            }
        }

        function parseIngredients(text) {
            const lines = text
                .split('\n')
                .filter(line => line.trim().length > 0);

            recognizedIngredients = lines.map(line => ({
                original: line.trim(),
                edited: line.trim()
            }));

            elements.loadingIndicator.classList.remove('active');
            displayIngredients();
            elements.ingredientsList.style.display = 'block';
        }

        function displayIngredients() {
            elements.ingredientsContainer.innerHTML = '';

            recognizedIngredients.forEach((ingredient, index) => {
                const div = document.createElement('div');
                div.className = 'ingredient-item';

                div.innerHTML = `
                    <input
                        type="text"
                        value="${ingredient.edited}"
                        data-index="${index}"
                        class="ingredient-input">

                    <button onclick="removeIngredient(${index})">
                        Löschen
                    </button>
                `;

                elements.ingredientsContainer.appendChild(div);
            });

            document.querySelectorAll('.ingredient-input').forEach(input => {
                input.addEventListener('change', event => {
                    const index = parseInt(event.target.dataset.index, 10);
                    recognizedIngredients[index].edited = event.target.value;
                });
            });
        }

        window.removeIngredient = index => {
            recognizedIngredients.splice(index, 1);
            displayIngredients();
        };

        elements.sendBringBtn.addEventListener('click', () => {
            const ingredientsList = recognizedIngredients
                .filter(ingredient => ingredient.edited.trim().length > 0)
                .map(ingredient => `
                    <li itemprop="ingredients">
                        ${ingredient.edited}
                    </li>
                `)
                .join('');

            const recipeHtml = `
                <div itemtype="http://schema.org/Recipe">
                    <h1 itemprop="name">Mein Rezept</h1>
                    <ul>
                        ${ingredientsList}
                    </ul>
                </div>
            `;

            const blob = new Blob([recipeHtml], {
                type: 'text/html'
            });

            const dataUrl = URL.createObjectURL(blob);
            sendToBring(dataUrl);
        });

        async function sendToBring(url) {
            try {
                elements.loadingIndicator.classList.add('active');
                elements.sendBringBtn.disabled = true;

                const response = await fetch(
                    'https://api.getbring.com/rest/bringrecipes/deeplink',
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            url,
                            source: 'web',
                            baseQuantity: 4,
                            requestedQuantity: 4
                        })
                    }
                );

                if (!response.ok) {
                    throw new Error('API-Fehler');
                }

                const data = await response.json();

                elements.loadingIndicator.classList.remove('active');
                elements.ingredientsList.style.display = 'none';
                window.location.href = data.deeplink;
            } catch (error) {
                showError(
                    'Fehler beim Senden zu Bring. Bitte versuche es erneut.'
                );

                console.error('Bring-Fehler:', error);
                elements.loadingIndicator.classList.remove('active');
                elements.sendBringBtn.disabled = false;
            }
        }

        function showError(message) {
            elements.errorMsg.textContent = message;
            elements.errorMsg.classList.add('active');
        }

        function hideError() {
            elements.errorMsg.classList.remove('active');
        }

        function resetAfterError() {
            elements.loadingIndicator.classList.remove('active');
            document.querySelector('.button-group').style.display = 'flex';
            elements.video.style.display = 'block';
            elements.canvas.style.display = 'none';
        }
    </script>
</body>
</html>
