<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecipeScan KI-Test</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            color: #222;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        h1 {
            margin-top: 0;
            color: #333;
        }

        .description {
            color: #666;
            line-height: 1.5;
        }

        .file-input {
            display: block;
            width: 100%;
            margin: 20px 0;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: white;
        }

        .preview {
            display: none;
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            margin: 20px 0;
            border-radius: 10px;
            background: #000;
        }

        .button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            min-height: 24px;
            margin-top: 20px;
            color: #555;
            white-space: pre-wrap;
        }

        .result {
            display: none;
            width: 100%;
            min-height: 240px;
            margin-top: 20px;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: #f8f8f8;
            font-family: monospace;
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-wrap;
            overflow-x: auto;
        }

        .error {
            color: #b00020;
        }

        .success {
            color: #146c2e;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>RecipeScan KI-Test</h1>

        <p class="description">
            Wähle ein Rezeptfoto aus. Das Bild wird stark komprimiert und
            anschließend an den KI-Worker gesendet.
        </p>

        <input
            id="imageInput"
            class="file-input"
            type="file"
            accept="image/*"
            capture="environment">

        <img
            id="preview"
            class="preview"
            alt="Vorschau des Rezeptfotos">

        <button id="analyzeButton" class="button" disabled>
            Bild analysieren
        </button>

        <div id="status" class="status"></div>

        <pre id="result" class="result"></pre>
    </main>

    <script>
        const workerUrl =
            'https://recipe-scan-ai.scanandcook.workers.dev/analyze';

        const maximumImageSize = 640;
        const maximumUploadSize = 300 * 1024;

        const elements = {
            imageInput: document.getElementById('imageInput'),
            preview: document.getElementById('preview'),
            analyzeButton: document.getElementById('analyzeButton'),
            status: document.getElementById('status'),
            result: document.getElementById('result')
        };

        let selectedImage = null;

        elements.imageInput.addEventListener('change', event => {
            const file = event.target.files[0];

            if (!file) {
                selectedImage = null;
                elements.analyzeButton.disabled = true;
                elements.preview.style.display = 'none';
                return;
            }

            selectedImage = file;
            elements.analyzeButton.disabled = false;
            elements.status.textContent =
                `Originalgröße: ${formatBytes(file.size)}`;
            elements.status.className = 'status';
            elements.result.style.display = 'none';
            elements.result.textContent = '';

            const imageUrl = URL.createObjectURL(file);
            elements.preview.src = imageUrl;
            elements.preview.style.display = 'block';
        });

        elements.analyzeButton.addEventListener('click', async () => {
            if (!selectedImage) {
                return;
            }

            try {
                elements.analyzeButton.disabled = true;
                elements.status.textContent =
                    'Bild wird stark komprimiert...';
                elements.status.className = 'status';
                elements.result.style.display = 'none';

                const optimizedImage =
                    await optimizeImage(selectedImage);

                elements.status.textContent =
                    `Uploadgröße: ${formatBytes(optimizedImage.size)}. ` +
                    'Analyse läuft...';

                const response = await fetch(workerUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'image/jpeg'
                    },
                    body: optimizedImage
                });

                const responseText = await response.text();

                let responseData;

                try {
                    responseData = JSON.parse(responseText);
                } catch {
                    responseData = {
                        rawResponse: responseText
                    };
                }

                if (!response.ok) {
                    throw new Error(
                        responseData.details ||
                        responseData.error ||
                        'Die Bildanalyse ist fehlgeschlagen.'
                    );
                }

                elements.status.textContent =
                    'Analyse erfolgreich abgeschlossen.';
                elements.status.className = 'status success';

                elements.result.textContent =
                    JSON.stringify(responseData, null, 2);
                elements.result.style.display = 'block';
            } catch (error) {
                elements.status.textContent = error.message;
                elements.status.className = 'status error';
            } finally {
                elements.analyzeButton.disabled = false;
            }
        });

        async function optimizeImage(file) {
            const imageUrl = URL.createObjectURL(file);

            try {
                const image = await loadImage(imageUrl);

                let width = image.width;
                let height = image.height;

                const scale = Math.min(
                    1,
                    maximumImageSize / Math.max(width, height)
                );

                width = Math.round(width * scale);
                height = Math.round(height * scale);

                for (let attempt = 0; attempt < 8; attempt++) {
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;

                    const context = canvas.getContext('2d', {
                        alpha: false
                    });

                    context.fillStyle = '#ffffff';
                    context.fillRect(0, 0, width, height);
                    context.drawImage(image, 0, 0, width, height);

                    const quality = Math.max(
                        0.25,
                        0.55 - attempt * 0.05
                    );

                    const blob = await canvasToBlob(
                        canvas,
                        'image/jpeg',
                        quality
                    );

                    if (blob.size <= maximumUploadSize) {
                        return blob;
                    }

                    width = Math.max(320, Math.round(width * 0.8));
                    height = Math.max(320, Math.round(height * 0.8));
                }

                throw new Error(
                    'Das Bild konnte nicht klein genug komprimiert werden.'
                );
            } finally {
                URL.revokeObjectURL(imageUrl);
            }
        }

        function loadImage(url) {
            return new Promise((resolve, reject) => {
                const image = new Image();

                image.onload = () => resolve(image);
                image.onerror = () => reject(
                    new Error('Das Bild konnte nicht geladen werden.')
                );

                image.src = url;
            });
        }

        function canvasToBlob(canvas, type, quality) {
            return new Promise((resolve, reject) => {
                canvas.toBlob(blob => {
                    if (blob) {
                        resolve(blob);
                    } else {
                        reject(
                            new Error(
                                'Das Bild konnte nicht komprimiert werden.'
                            )
                        );
                    }
                }, type, quality);
            });
        }

        function formatBytes(bytes) {
            if (bytes < 1024) {
                return `${bytes} Bytes`;
            }

            if (bytes < 1024 * 1024) {
                return `${(bytes / 1024).toFixed(1)} KB`;
            }

            return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
        }
    </script>
</body>
</html>
